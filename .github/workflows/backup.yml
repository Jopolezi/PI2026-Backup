name: backup

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    env:
      DEST: https://Jopolezi:${{ secrets.BACKUP_TOKEN }}@github.com/Jopolezi/PI2026-Backup.git
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: |
          git -c http.https://github.com/.extraheader= push --prune "$DEST" \
            "+refs/remotes/origin/*:refs/heads/*" \
            "+refs/tags/*:refs/tags/*"
